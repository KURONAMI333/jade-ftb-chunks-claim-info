plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// headless 検証専用の source set。`jar` は sourceSets.main だけを詰めるので、
// ここに置いたテストクラス・構造 NBT は出荷 jar に入らない。
sourceSets {
    gametest {
        // Host-mod APIs (FTB Chunks/Teams/Library) live in compileOnly/localRuntime —
        // carry them onto the gametest classpath so tests can use the real classes.
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

repositories {
    // FTB Chunks / FTB Library / FTB Teams
    maven { url = 'https://maven.ftb.dev/releases' }
    // architectury (FTB の推移依存の解決用)
    maven { url = 'https://maven.architectury.dev/' }
    // Modrinth maven (Jade)
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
            // 受入試験用: ログを client の run/ と分離し、runclient_fresh.sh の
            // is_dev_server 判定（cmdline 中の serverRun 検出）に載せるための目印。
            gameDirectory = file('run/server')
            systemProperty 'serverRun', 'true'
        }

        // 検証用: 起動と同時に専用サーバーへ繋ぐクライアント。
        // 接続先は -PmpAddress=host:port で差し替えられる（既定は同プロジェクトの runServer）。
        clientMp {
            client()
            programArgument '--quickPlayMultiplayer'
            programArgument project.findProperty('mpAddress') ?: 'localhost'
        }

        // headless の挙動検証。GUI は開かない。gameDirectory は専用に分ける。
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            sourceSet = sourceSets.gametest
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // GameTest の登録スキャンは mod のファイル一覧を見るので、検証用 source set も
            // 同じ mod に属させる。jar の中身には影響しない。
            sourceSet(sourceSets.gametest)
        }
    }

    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.test)
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// ─────────────────────────────────────────────────────────────
// Dependencies
// 公開 jar には compileOnly + localRuntime のいずれもバンドルされない
// ─────────────────────────────────────────────────────────────
dependencies {
    // ─── Production ─────────────────────────────────────────────
    // Jade: tooltip の表示先 (required, client)
    compileOnly "maven.modrinth:jade:${jade_version}"

    // FTB Chunks: claim データの読み取り元 (required, client)。
    // dev.ftb.mods.ftbchunks.client.map.* は public だが api パッケージではない
    // 内部層。FtbClaimLookup が Throwable を捕捉して自動無効化する soft-fail 設計。
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    // MapChunk.getTeam() が返す Team (ftbteams) にも触れるので compile に要る。
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    // ─── Dev-only (runClient テスト用、公開 jar には含まれない) ─────
    localRuntime "maven.modrinth:jade:${jade_version}"
    localRuntime "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// 検証コードの腐りをビルドで拾う（実行はしない。実行は runGameTestServer）。
tasks.named('check') {
    dependsOn tasks.named('compileGametestJava')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
            mod_authors            : mod_authors,
            ftb_chunks_version_range: ftb_chunks_version_range,
            jade_version_range     : jade_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LICENSE jar 同梱
def licenseFile = file('LICENSE')
def licenseRenamed = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    inputs.file(licenseFile)
    from(licenseFile) { rename { licenseRenamed } }
}
