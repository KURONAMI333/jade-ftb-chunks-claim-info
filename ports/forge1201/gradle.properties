# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

#you can find this on the ForgeGradle docs, at https://docs.minecraftforge.net/en/fg-6.x/configuration/runs/
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Environment Properties
# You can find the latest versions here: https://projects.minecraftforge.net/versions/
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, alphas, and betas are not valid in this format
# This property is not strictly required, but it is needed if you want to publish to maven
minecraft_version_range=[1.20.1]
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.13
# The Forge version range can use any release version of Forge as bounds or match the loader major version
forge_version_range=[47,48)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,48)

# The pack format for your mod's resources.
# You can find the pack format numbers on the Minecraft wiki
pack_format_number=15

# Mod Properties
mod_id=jadeftbclaims
mod_name=Jade x FTB Chunks Claim Info
mod_license=All Rights Reserved
# This property is required for mods uploaded to Modrinth's Maven
#modrinth_id=please-go-check-it-out
mod_version=0.2.0+forge.1.20.1
# See https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties
mod_group_id=com.kuronami.jadeftbclaims
mod_authors=KURONAMI
# This is a txt file with the mods description, one per line.
mod_description=Shows the claim owner's Minecraft skin face next to the team name in Jade, with the existing force-load marker. Client-side only.

# Dependency Versions
jade_version=11.13.3+forge
jade_version_range=[11.13.3,)
ftb_chunks_version=2001.3.8
ftb_chunks_version_range=[2001.3.8,)
ftb_library_version=2001.2.13
ftb_library_version_range=[2001.2.13,)
ftb_teams_version=2001.3.2
ftb_teams_version_range=[2001.3.2,)
architectury_version=9.2.14
