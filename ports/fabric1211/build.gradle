plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Compile-only host APIs are provided by the player-installed client mods.
    modCompileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }

    // Dev runtime mirrors the required client host set; none is bundled in our jar.
    modRuntimeOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
    modRuntimeOnly("dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}") { transitive = false }
    modRuntimeOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }
    modRuntimeOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }
    modRuntimeOnly "dev.architectury:architectury-fabric:${architectury_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    inputs.properties([
        version: project.version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        fabric_loader_version: fabric_loader_version,
    ])
    filesMatching('fabric.mod.json') { expand inputs.properties }
}

tasks.named('jar', Jar).configure {
    inputs.file(file('LICENSE'))
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
        }
    }
}
