# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings for readable parameter names / javadoc
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

## Mod Properties (provisional — 番号・名前は暫定)
mod_id=jadeftbclaims
mod_name=Jade x FTB Chunks Claim Info
mod_license=All Rights Reserved
mod_version=0.2.1
mod_group_id=com.kuronami.jadeftbclaims
mod_authors=KURONAMI
mod_description=Shows the claiming team and its owner's skin face in Jade's tooltip. Client-side only.

# ─── Dependency versions ───────────────────────────────────────
# FTB Chunks (1.21.1 NeoForge): claim データの読み取り元 (required, client)
# 実コード検証は 2101.1.22 (v2101.1.22 tag) で実施。client.map.* は内部層のため
# 上限を設けず、壊れたら FtbClaimLookup が自動無効化する設計。
ftb_chunks_version=2101.1.22
ftb_chunks_version_range=[2101.1.22,)
# FTB Chunks の推移依存 (dev runtime 用)
ftb_library_version=2101.1.36
ftb_teams_version=2101.1.9

# Jade (1.21.1 NeoForge): tooltip のホスト (required, client)
# maven.modrinth 経由。maven.snownee.xyz は到達不能の実績があるため使わない。
jade_version=15.10.6+neoforge
jade_version_range=[15.10.6,)
